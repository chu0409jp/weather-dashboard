<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyWeather v4</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    background:#071a3d;
    color:#fff;
    font-family:"Microsoft JhengHei",sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    margin:10px 0 15px;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:15px;
}

input{
    padding:8px;
    border:none;
    border-radius:8px;
}

button{
    cursor:pointer;
}

.add-btn{
    border:none;
    border-radius:8px;
    background:#4caf50;
    color:white;
    padding:8px 12px;
}

.refresh-btn{
    border:none;
    border-radius:8px;
    background:#2196f3;
    color:white;
    padding:8px 12px;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));
    gap:10px;
}

.card{
    border-radius:16px;
    padding:12px;
    color:black;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
}

.city{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
    font-weight:bold;
}

.city-actions{
    display:flex;
    gap:2px;
}

.city-actions button{
    border:none;
    border-radius:6px;
    padding:4px 6px;
    cursor:pointer;
    background:white;
}

.delete-btn{
    background:red !important;
    color:white;
}

.temp{
    font-size:32px;
    font-weight:bold;
    margin:6px 0;
}

.desc{
    margin-bottom:8px;
    font-size:14px;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    font-size:14px;
}

.forecast{
    display:flex;
    overflow-x:auto;
    gap:6px;
    margin-top:10px;
}

.forecast-item{
    min-width:70px;
    text-align:center;
    padding:4px;
    border-radius:8px;
    background:rgba(255,255,255,.25);
    font-size:12px;
}

.footer{
    text-align:center;
    margin-top:15px;
    color:#ccc;
    font-size:12px;
}

@media(max-width:768px){

    .temp{
        font-size:28px;
    }

    .card{
        padding:10px;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>🌤 自製天氣APP v4</h1>

<div class="toolbar">

    <input
    id="cityInput"
    placeholder="輸入城市名稱">

    <button
    class="add-btn"
    onclick="addCity()">
    ➕ 新增城市
    </button>

    <button
    class="refresh-btn"
    onclick="loadAllWeather()">
    🔄 Refresh
    </button>

</div>

<div id="myWeather">
⏳ 正在取得GPS定位...
</div>

<div
id="weatherGrid"
class="grid">
</div>

<div
id="updateTime"
class="footer">
</div>

</div>

<script>

const cityDatabase={

    台北:{
        name:"台北",
        lat:25.0330,
        lon:121.5654
    },

    東京:{
        name:"東京",
        lat:35.6762,
        lon:139.6503
    },

    大阪:{
        name:"大阪",
        lat:34.6937,
        lon:135.5023
    },

    哈爾濱:{
        name:"哈爾濱",
        lat:45.8038,
        lon:126.5350
    },

    米澤:{
        name:"米澤",
        lat:37.9222,
        lon:140.1167
    },

    上海:{
        name:"上海",
        lat:31.2304,
        lon:121.4737
    }

};

let cities=
JSON.parse(
localStorage.getItem("cities")
)
||
[
cityDatabase.台北,
cityDatabase.東京,
cityDatabase.大阪,
cityDatabase.哈爾濱,
cityDatabase.米澤,
cityDatabase.上海
];

function saveCities(){

    localStorage.setItem(
        "cities",
        JSON.stringify(cities)
    );

}

function getColor(temp){

    if(temp<=0) return "#ffffff";
    if(temp<=10) return "#bde0ff";
    if(temp<=22) return "#fff2a8";
    if(temp<=29) return "#f7d34a";
    if(temp<=36) return "#ffb54a";

    return "#ff5555";
}

function weatherCode(code){

    const map={

        0:"☀️ 晴天",
        1:"🌤 晴時多雲",
        2:"⛅ 多雲",
        3:"☁️ 陰天",
        45:"🌫 有霧",
        48:"🌫 濃霧",
        51:"🌦 毛毛雨",
        61:"🌧 下雨",
        71:"❄️ 下雪",
        95:"⛈ 雷雨"

    };

    return map[code] || "🌤";
}

async function fetchWeather(url){

    try{

        const res=await fetch(url);

        if(!res.ok){
            throw new Error();
        }

        return await res.json();

    }catch(error){

        console.error(error);

        return null;

    }

}

async function loadMyWeather(lat,lon){

    const url=
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m&timezone=auto`;

    const data=
    await fetchWeather(url);

    if(!data){

        document.getElementById(
        "myWeather"
        ).innerHTML=
        "❌ 天氣資料取得失敗";

        return;
    }

    const temp=
    data.current_weather.temperature;

    let html=`

    <div class="card"
    style="background:${getColor(temp)}">

        <div class="city">
            📍目前位置（GPS）
        </div>

        <div class="temp">
            ${temp}°C
        </div>

        <div class="forecast">
    `;

    const now=new Date();

    const startIndex=
    data.hourly.time.findIndex(
    t=>new Date(t)>now
    );

    for(let i=0;i<6;i++){

        if(
        startIndex+i>=
        data.hourly.time.length
        ){
            break;
        }

        const d=
        new Date(
        data.hourly.time[startIndex+i]
        );

        const hh=
        String(
        d.getHours()
        ).padStart(2,"0");

        html+=`

        <div class="forecast-item">

            ${hh}:00

            <br>

            ${data.hourly.temperature_2m[startIndex+i]}°

        </div>

        `;
    }

    html+=`
        </div>
    </div>
    `;

    document.getElementById(
    "myWeather"
    ).innerHTML=html;
}

async function createCard(city){

    const url=
    `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&hourly=relativehumidity_2m,precipitation_probability&timezone=auto`;

    const data=
    await fetchWeather(url);

    if(!data){

        return `
        <div class="card"
        style="background:#999">
        ⚠️ ${city.name}<br>
        資料取得失敗
        </div>
        `;
    }

    const temp=
    data.current_weather.temperature;

    return `

    <div class="card"
    style="background:${getColor(temp)}">

        <div class="city">

            <span>${city.name}</span>

            <div class="city-actions">

                <button
                onclick="moveUp('${city.name}')">
                ⬆️
                </button>

                <button
                onclick="moveDown('${city.name}')">
                ⬇️
                </button>

                <button
                class="delete-btn"
                onclick="removeCity('${city.name}')">
                🗑️
                </button>

            </div>

        </div>

        <div class="temp">
            🌡️ ${temp}°C
        </div>

        <div class="desc">
            ${weatherCode(
            data.current_weather.weathercode
            )}
        </div>

        <div class="info-grid">

            <div>
            💧 ${data.hourly.relativehumidity_2m[0]}%
            </div>

            <div>
            ☔ ${data.hourly.precipitation_probability[0]}%
            </div>

            <div>
            ⬆ ${data.daily.temperature_2m_max[0]}°C
            </div>

            <div>
            ⬇ ${data.daily.temperature_2m_min[0]}°C
            </div>

        </div>

    </div>

    `;
}

async function loadAllWeather(){

    const cards=
    await Promise.all(
        cities.map(
        city=>createCard(city)
        )
    );

    document.getElementById(
    "weatherGrid"
    ).innerHTML=
    cards.join("");

    document.getElementById(
    "updateTime"
    ).innerText=
    "Last Update : "
    +new Date().toLocaleString();
}

function addCity(){

    const cityName=
    document.getElementById(
    "cityInput"
    ).value.trim();

    if(!cityName) return;

    const city=
    cityDatabase[cityName];

    if(!city){

        alert(
        "城市不存在於資料庫"
        );

        return;
    }

    const exist=
    cities.some(
    c=>c.name===city.name
    );

    if(exist){

        alert(
        "城市已存在"
        );

        return;
    }

    cities.push(city);

    saveCities();

    loadAllWeather();

    document.getElementById(
    "cityInput"
    ).value="";
}

function removeCity(name){

    cities=
    cities.filter(
    c=>c.name!==name
    );

    saveCities();

    loadAllWeather();
}

function moveUp(cityName){

    const index=
    cities.findIndex(
    c=>c.name===cityName
    );

    if(index<=0){
        return;
    }

    [
    cities[index-1],
    cities[index]
    ]
    =
    [
    cities[index],
    cities[index-1]
    ];

    saveCities();

    loadAllWeather();
}

function moveDown(cityName){

    const index=
    cities.findIndex(
    c=>c.name===cityName
    );

    if(
    index===-1 ||
    index===cities.length-1
    ){
        return;
    }

    [
    cities[index+1],
    cities[index]
    ]
    =
    [
    cities[index],
    cities[index+1]
    ];

    saveCities();

    loadAllWeather();
}

navigator.geolocation.getCurrentPosition(

async(position)=>{

    await loadMyWeather(
        position.coords.latitude,
        position.coords.longitude
    );

},

()=>{

    document.getElementById(
    "myWeather"
    ).innerHTML=
    "❌ 無法取得GPS定位";

},

{
    enableHighAccuracy:true,
    timeout:10000,
    maximumAge:300000
}

);

loadAllWeather();

</script>

</body>
</html>
