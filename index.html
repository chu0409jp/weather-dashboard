<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyWeather v7</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;background:#071a3d;color:#fff;font-family:"Microsoft JhengHei",sans-serif;}
.container{max-width:1400px;margin:auto;}
h1{text-align:center;margin:10px 0 15px;}
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:15px;}
input{padding:8px;border:none;border-radius:8px;}
button{cursor:pointer;}
.add-btn{border:none;border-radius:8px;background:#4caf50;color:white;padding:8px 12px;}
.refresh-btn{border:none;border-radius:8px;background:#2196f3;color:white;padding:8px 12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;}
.card{border-radius:16px;padding:12px;color:black;box-shadow:0 3px 10px rgba(0,0,0,.25);}
.city{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:bold;cursor:pointer;}
.city-actions{display:flex;gap:2px;}
.city-actions button{border:none;border-radius:6px;padding:4px 6px;background:white;}
.delete-btn{background:red!important;color:white;}
.temp{font-size:32px;font-weight:bold;margin:6px 0;}
.desc{margin-bottom:8px;font-size:14px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:14px;}
.forecast{display:flex;overflow-x:auto;gap:6px;margin-top:10px;}
.forecast-item{min-width:100px;text-align:center;padding:4px;border-radius:8px;background:rgba(255,255,255,.25);font-size:12px;}
.footer{text-align:center;margin-top:15px;color:#ccc;font-size:12px;}
</style></head><body><div class="container">
<h1>🌤 自製天氣APP v7</h1>
<div class="toolbar"><input id="cityInput" placeholder="輸入城市名稱 (例: 品川区、習志野市)"><button class="add-btn" onclick="addCity()">➕ 新增城市</button><button class="refresh-btn" onclick="loadAllWeather()">🔄 Refresh</button></div>
<div id="myWeather">⏳ 正在取得GPS定位...</div><div id="weatherGrid" class="grid"></div><div id="updateTime" class="footer"></div></div>
<script>
const cityDatabase={台北:{name:'台北',lat:25.0330,lon:121.5654},東京:{name:'東京',lat:35.6762,lon:139.6503},大阪:{name:'大阪',lat:34.6937,lon:135.5023},哈爾濱:{name:'哈爾濱',lat:45.8038,lon:126.5350},米澤:{name:'米澤',lat:37.9222,lon:140.1167},上海:{name:'上海',lat:31.2304,lon:121.4737}};
let cities=JSON.parse(localStorage.getItem('cities'))||Object.values(cityDatabase);
let expandedCity=null;
function saveCities(){localStorage.setItem('cities',JSON.stringify(cities));}
function getColor(t){if(t<=0)return '#fff';if(t<=10)return '#bde0ff';if(t<=22)return '#fff2a8';if(t<=29)return '#f7d34a';if(t<=36)return '#ffb54a';return '#ff5555';}
function weatherCode(c){const m={0:'☀️ 晴天',1:'🌤 晴時多雲',2:'⛅ 多雲',3:'☁️ 陰天',45:'🌫 有霧',48:'🌫 濃霧',51:'🌦 毛毛雨',61:'🌧 下雨',71:'❄️ 下雪',95:'⛈ 雷雨'};return m[c]||'🌤';}
function rainDesc(r){if(r===0)return `☀️ 沒下雨 (${r} mm)`;if(r<=1)return `🌦️ 小雨 (${r} mm)`;if(r<=5)return `🌧️ 中雨 (${r} mm)`;if(r<=20)return `⛈️ 大雨 (${r} mm)`;return `🚨 豪雨 (${r} mm)`;}
async function fetchWeather(url){try{const r=await fetch(url);if(!r.ok)throw new Error();return await r.json();}catch(e){return null;}}
async function searchCity(cityName){const url=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=ja&format=json`;const r=await fetch(url);const d=await r.json();if(!d.results||d.results.length===0)return null;return {name:d.results[0].name,lat:d.results[0].latitude,lon:d.results[0].longitude};}
function toggleForecast(name){expandedCity=(expandedCity===name)?null:name;loadAllWeather();}
async function loadMyWeather(lat,lon){const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,precipitation&timezone=auto`;const data=await fetchWeather(url);if(!data){document.getElementById('myWeather').innerHTML='❌ 取得失敗';return;}let html=`<div class="card" style="background:${getColor(data.current_weather.temperature)}"><div class="city">📍目前位置（GPS）</div><div class="temp">${data.current_weather.temperature}°C</div><div class="forecast">`;const now=new Date();const startIndex=data.hourly.time.findIndex(t=>new Date(t)>=now);for(let i=0;i<6;i++){const hh=new Date(data.hourly.time[startIndex+i]).getHours().toString().padStart(2,'0');const rain=data.hourly.precipitation[startIndex+i]||0;html+=`<div class="forecast-item">${hh}:00<br>🌡️ ${data.hourly.temperature_2m[startIndex+i]}°C<br>${rainDesc(rain)}</div>`;}html+='</div></div>';document.getElementById('myWeather').innerHTML=html;}
async function createCard(city){const url=`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&hourly=relativehumidity_2m,precipitation_probability,temperature_2m,precipitation&timezone=auto`;const data=await fetchWeather(url);if(!data)return '';const temp=data.current_weather.temperature;let detailHtml='';if(expandedCity===city.name){const now=new Date();const idx=data.hourly.time.findIndex(t=>new Date(t)>=now);detailHtml='<div class="forecast">';for(let i=0;i<6;i++){if(idx+i>=data.hourly.time.length)break;const hh=new Date(data.hourly.time[idx+i]).getHours().toString().padStart(2,'0');const rain=data.hourly.precipitation[idx+i]||0;detailHtml+=`<div class="forecast-item">${hh}:00<br>🌡️ ${data.hourly.temperature_2m[idx+i]}°C<br>${rainDesc(rain)}</div>`;}detailHtml+='</div>';}return `<div class="card" style="background:${getColor(temp)}"><div class="city" onclick="toggleForecast('${city.name}')"><span>${expandedCity===city.name?'▼':'▶'} ${city.name}</span><div class="city-actions" onclick="event.stopPropagation();"><button onclick="moveUp('${city.name}')">⬆️</button><button onclick="moveDown('${city.name}')">⬇️</button><button class="delete-btn" onclick="removeCity('${city.name}')">🗑️</button></div></div><div class="temp">🌡️ ${temp}°C</div><div class="desc">${weatherCode(data.current_weather.weathercode)}</div><div class="info-grid"><div>💧 ${data.hourly.relativehumidity_2m[0]}%</div><div>☔ ${(data.hourly.precipitation_probability?.[0]??0)}%</div><div>⬆ ${data.daily.temperature_2m_max[0]}°C</div><div>⬇ ${data.daily.temperature_2m_min[0]}°C</div></div>${detailHtml}</div>`;}
async function loadAllWeather(){const cards=await Promise.all(cities.map(c=>createCard(c)));document.getElementById('weatherGrid').innerHTML=cards.join('');document.getElementById('updateTime').innerText='Last Update : '+new Date().toLocaleString();}
async function addCity(){const cityName=document.getElementById('cityInput').value.trim();if(!cityName)return;const city=await searchCity(cityName);if(!city){alert('找不到城市');return;}if(cities.some(c=>c.name===city.name)){alert('城市已存在');return;}cities.push(city);saveCities();loadAllWeather();document.getElementById('cityInput').value='';}
function removeCity(n){cities=cities.filter(c=>c.name!==n);saveCities();loadAllWeather();}
function moveUp(n){const i=cities.findIndex(c=>c.name===n);if(i<=0)return;[cities[i-1],cities[i]]=[cities[i],cities[i-1]];saveCities();loadAllWeather();}
function moveDown(n){const i=cities.findIndex(c=>c.name===n);if(i<0||i===cities.length-1)return;[cities[i+1],cities[i]]=[cities[i],cities[i+1]];saveCities();loadAllWeather();}
navigator.geolocation.getCurrentPosition(async p=>{await loadMyWeather(p.coords.latitude,p.coords.longitude);},()=>{document.getElementById('myWeather').innerHTML='❌ 無法取得GPS定位';},{enableHighAccuracy:true,timeout:10000,maximumAge:300000});loadAllWeather();
</script></body></html>
