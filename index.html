<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeatherDashboard_v2</title><style>body{margin:0;padding:20px;background:#071a3d;color:#fff;font-family:"Microsoft JhengHei",sans-serif}.container{max-width:1600px;margin:auto}.header{text-align:center}.search-box{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}.search-box input{padding:12px;border-radius:12px;border:none;width:320px}.btn{border:none;background:#0ea5e9;color:#fff;padding:12px 18px;border-radius:12px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{position:relative;border-radius:24px;padding:24px;min-height:220px;box-shadow:0 10px 25px rgba(0,0,0,.35);animation:cardFadeIn .5s ease}.city{text-align:center;font-size:36px;font-weight:700;margin-bottom:20px}.row{display:flex;justify-content:space-between;margin:10px 0}.deleteBtn{position:absolute;top:12px;right:12px;width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(10px);opacity:0;transition:.25s}.card:hover .deleteBtn{opacity:1}.toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:14px;color:#fff;z-index:9999}.toast-success{background:rgba(34,197,94,.9)}.toast-delete{background:rgba(239,68,68,.9)}.toast-info{background:rgba(15,23,42,.92)}@keyframes cardFadeIn{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}</style></head><body><div class="container"><div class="header"><h1>⛅ 天氣比較儀表板</h1></div><div class="search-box"><input id="citySearch" placeholder="輸入城市名稱"><button class="btn" onclick="addCity()">➕加入城市</button><button class="btn" onclick="loadWeather()">🔄更新</button><button class="btn" onclick="resetCities()">↺恢復預設</button></div><div id="weatherContainer" class="cards"></div><div id="updateTime"></div></div><script>const defaultCities=[{name:'🇹🇼 台北',lat:25.033,lon:121.5654},{name:'🇯🇵 東京',lat:35.6762,lon:139.6503},{name:'🇯🇵 大阪',lat:34.6937,lon:135.5023},{name:'🇨🇳 上海',lat:31.2304,lon:121.4737},{name:'🇨🇳 哈爾濱',lat:45.8038,lon:126.5349},{name:'🇯🇵 米澤',lat:37.9222,lon:140.1168}];let cities=JSON.parse(localStorage.getItem('weatherDashboardCities'))||[...defaultCities];const cityDatabase={'福岡':{lat:33.5902,lon:130.4017},'名古屋':{lat:35.1815,lon:136.9066},'北京':{lat:39.9042,lon:116.4074}};function saveCities(){localStorage.setItem('weatherDashboardCities',JSON.stringify(cities));}function resetCities(){cities=[...defaultCities];saveCities();showToast('已恢復預設城市','info');loadWeather();}function showToast(m,t='info'){const d=document.createElement('div');d.className='toast toast-'+t;d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000);}function addCity(){const city=document.getElementById('citySearch').value.trim();if(!cityDatabase[city])return;cities.push({name:city,lat:cityDatabase[city].lat,lon:cityDatabase[city].lon});saveCities();showToast(city+' 已加入','success');loadWeather();}function removeCity(name){if(cities.length<=1){alert('至少保留一個城市');return;}cities=cities.filter(c=>c.name!==name);saveCities();showToast(name+' 已刪除','delete');loadWeather();}function getTempColor(t){if(t<=0)return '#fff';if(t<=10)return '#dbeafe';if(t<=22)return '#fef9c3';if(t<=29)return '#facc15';if(t<=36)return '#fb923c';return '#ef4444';}function getTextColor(bg){const h=bg.replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return (((r*299)+(g*587)+(b*114))/1000)>160?'#000':'#fff';}function weatherText(c){return {0:'☀️ 晴天',1:'🌤 晴時多雲',2:'⛅ 多雲',3:'☁️ 陰天'}[c]||'未知';}async function getCityWeather(city){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,relative_humidity_2m,weather_code&hourly=precipitation_probability`);const d=await r.json();return {city:city.name,temp:Number(d.current.temperature_2m),humi:Number(d.current.relative_humidity_2m),weather:weatherText(d.current.weather_code),rain:Number(d.hourly?.precipitation_probability?.[0]||0)};}catch(e){return {city:city.name,temp:0,humi:0,weather:'失敗',rain:0};}}async function loadWeather(){const c=document.getElementById('weatherContainer');c.innerHTML='';const rs=await Promise.all(cities.map(getCityWeather));rs.sort((a,b)=>b.temp-a.temp);const max=Math.max(...rs.map(x=>x.temp));const min=Math.min(...rs.map(x=>x.temp));rs.forEach(i=>{const bg=getTempColor(i.temp),tc=getTextColor(bg);let icon=i.temp===max?'🔥':(i.temp===min?'❄️':'');c.innerHTML+=`<div class="card" style="background:${bg};color:${tc}"><button class="deleteBtn" onclick="removeCity('${i.city}')">✕</button><div class="city">${icon} ${i.city}</div><div class="row"><span>🌡氣溫</span><span>${i.temp.toFixed(1)}°C</span></div><div class="row"><span>💧濕度</span><span>${i.humi}%</span></div><div class="row"><span>☁️天氣</span><span>${i.weather}</span></div><div class="row"><span>☔降雨</span><span>${i.rain}%</span></div></div>`});document.getElementById('updateTime').innerText='最後更新：'+new Date().toLocaleString();}document.getElementById('citySearch').addEventListener('keypress',e=>{if(e.key==='Enter')addCity();});loadWeather();setInterval(loadWeather,3600000);</script></body></html>
